    <script>
        document.getElementById('obsForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await authenticatedFetch(`${API_BASE_URL}/save-observation`, {
                method: 'POST',
                body: JSON.stringify(data)
            });

            if (!response) return; // Handled by auth.js if 401

            const result = await response.json();
            alert(result.message || 'Saved!');
        } catch (error) {
            console.error('Error saving observation:', error);
            alert('Failed to save observation: ' + error.message);
        }
        });
        </script>
        <script>
        document.getElementById('loadPrevBtn').addEventListener('click', async () => {

        try {

    // Function to calculate QFE = PR_READ - CORRECTION
// CONSTANTS
const g = 9.80665;
const R = 287.05;
const T0 = 288.15;
const alpha = -0.0065;
// Get station elevation from logged-in user's token (falls back to 0 if not set)
const user = getUser();
const stationElevation = (user && user.elevation) ? user.elevation : 0;

function calculateQFE(prRead, correction) {
  if (isNaN(prRead) || isNaN(correction)) return null;
  return prRead - correction;
}

function calculateQNH(qfe, stationElevation) {
  if (isNaN(qfe) || isNaN(stationElevation)) return null;

  const exponent =
    (stationElevation * g) /
    (R * (T0 + (alpha * stationElevation) / 2));

  return qfe * Math.exp(exponent);
}


function calculateQNE(prRead) {
  if (isNaN(prRead)) return null;

  // Standard atmosphere conversion
  return Math.round((44330 * (1 - Math.pow(prRead / 1013.25, 0.1903))));
}

function updatePressureFields() {
  const prRead = parseFloat(document.getElementById('pr_read').value);
  const correction = parseFloat(document.getElementById('correction').value);

  const qfe = calculateQFE(prRead, correction);
  if (qfe !== null) {
    document.getElementById('qfe').value = qfe.toFixed(1);
  } else {
    document.getElementById('qfe').value = '';
    return;
  }

function truncateDecimal(value, decimals) {
  const factor = 10 ** decimals;
  return (value < 0)
    ? Math.ceil(value * factor) / factor
    : Math.floor(value * factor) / factor;
}

  const qnh = calculateQNH(qfe, stationElevation);
  if (qnh !== null) {
document.getElementById('qnh').value =
  truncateDecimal(qnh, 0);

  }

  const qne = calculateQNE(prRead);
  if (qne !== null) {
    document.getElementById('qne').value = qne;
  }
}

['pr_read', 'correction'].forEach(id => {
  document.getElementById(id).addEventListener('input', updatePressureFields);
});


    document.addEventListener('DOMContentLoaded', function() {
    const rainfallInput = document.querySelector('input[name="rainfall"]');
    const evapPanInput = document.querySelector('input[name="evap_pan"]');
    const evaporationInput = document.querySelector('input[name="e_p"]');

    evaporationInput.readOnly = true; // E field should not be edited manually
    
    function calculateEvaporation() {
        const evapPanVal = evapPanInput.value.trim();

        // Only calculate if evap_pan field has input data
        if (evapPanVal === '') {
        evaporationInput.value = '';
        return;
        }

        let rainfallVal = rainfallInput.value.trim();
        let rainfall = 0.0;

        // Handle empty, TRACE, or T rainfall as 0.0
        if (rainfallVal === '' || rainfallVal.toUpperCase() === 'TRACE' || rainfallVal.toUpperCase() === 'T') {
        rainfall = 0.0;
        } else {
        rainfall = parseFloat(rainfallVal);
        if (isNaN(rainfall)) rainfall = 0.0;
        }

        const cups = parseFloat(evapPanVal);
        if (isNaN(cups)) {
        evaporationInput.value = '';
        return;
        }

        // Calculate E = R + (0.5 × cups)
        const evaporation = rainfall + (0.5 * cups);

        // Display with one decimal place
        evaporationInput.value = evaporation.toFixed(1);
    }

    // Trigger calculation only when evap_pan input changes
    evapPanInput.addEventListener('input', calculateEvaporation);
    });

    document.addEventListener('DOMContentLoaded', async function() {
    const todayWindRunInput = document.querySelector('input[name="wind_run"]');
    const wRunInput = document.querySelector('input[name="w_run"]');
    let yesterdayWindRun = null;

    wRunInput.readOnly = true;

    // Fetch yesterday’s wind_run
    try {
        const response = await authenticatedFetch(`${API_BASE_URL}/getYesterdayWindRun`);
        const data = await response.json();
        yesterdayWindRun = parseFloat(data.wind_run) || 0.0;
    } catch (error) {
        console.error('Error fetching yesterday wind_run:', error);
    }

    // Calculate automatically when today's value changes
    todayWindRunInput.addEventListener('input', function() {
        const todayVal = parseFloat(todayWindRunInput.value);
        if (!isNaN(todayVal) && !isNaN(yesterdayWindRun)) {
        let result = todayVal - yesterdayWindRun;
        if (result < 0) result += 10000; // handle counter rollover
        wRunInput.value = result.toFixed(2);
        } else {
        wRunInput.value = '';
        }
    });
    });

function computeHumidityFromWetbulb(T, Tw, P) {
  T = parseFloat(T);
  Tw = parseFloat(Tw);
  P = parseFloat(P);

  if ([T, Tw, P].some(x => isNaN(x))) return null;

  const Es = 6.112 * Math.exp((17.67 * T) / (T + 243.5));
  const Ew = 6.112 * Math.exp((17.67 * Tw) / (Tw + 243.5));
  const E = Ew - P * (T - Tw) * 0.00066 * (1 + 0.00115 * Tw);
  const RH = (E / Es) * 100;
  const Td = (243.5 * Math.log(E / 6.112)) / (17.67 - Math.log(E / 6.112));

  return { RH, Td };
}



function populateSynopFromObservation() {
  const dryBulb = document.querySelector('input[name="dry_bulb"]').value;
  const wetBulb = document.querySelector('input[name="wet_bulb"]').value;
  const pressure = document.querySelector('input[name="pr_read"]').value;
  const rhField = document.querySelector('input[name="r_h"]');
  const rhDw = document.querySelector('input[name="rh_dw"]').value;
  const calcDp = document.querySelector('input[name="dw_wb"]').value;
  const dewField = document.querySelector('input[name="dew_point"]');
  const qfe = document.querySelector('input[name="qfe"]');

  // If T, Tw, and P are provided → compute RH and Dew Point
  if (dryBulb && wetBulb && pressure) {
    const result = computeHumidityFromWetbulb(dryBulb, wetBulb, pressure);
    if (result) {
      rhField.value = result.RH.toFixed(0);
      dewField.value = result.Td.toFixed(1);
    }
  }
  // Else if T, RH, Dew Point, and P are provided → compute Tw
  else if (dryBulb && rhDw && calcDp && pressure) {
    const Tw = computeWetbulbFromHumidity(dryBulb, rhDw, pressure, calcDp);
    if (Tw !== null && !isNaN(Tw)) {
      document.querySelector('input[name="wet_bulb2"]').value = Tw.toFixed(1);
    }
  }

    // WB Depression
  if (dryBulb && wetBulb) {
    const wbDep = Number(dryBulb) - Number(wetBulb);
    document.querySelector('input[name="wb_dep"]').value = wbDep.toFixed(1);
  } else {
    document.querySelector('input[name="wb_dep"]').value = '';
  }


}

// --- Compute Wet Bulb using Dry Bulb, RH, Dew Point, and Pressure ---
function computeWetbulbFromHumidity(T, RH, P, Td) {
  T = parseFloat(T);
  RH = parseFloat(RH);
  P = parseFloat(P);
  Td = parseFloat(Td);

  if ([T, RH, P, Td].some(x => isNaN(x))) return null;

  // Psychrometric constant (kPa/°C)
  const gamma = 0.000665 * P;

  // Saturation vapor pressure (kPa)
  const e_s = 0.6108 * Math.exp((17.27 * T) / (T + 237.3));

  // Actual vapor pressure (from dew point)
  const e_a = 0.6108 * Math.exp((17.27 * Td) / (Td + 237.3));

  // Stull’s empirical wet-bulb approximation (base)
  const Tw = T * Math.atan(0.151977 * Math.sqrt(RH + 8.313659))
           + Math.atan(T + RH)
           - Math.atan(RH - 1.676331)
           + 0.00391838 * Math.pow(RH, 1.5) * Math.atan(0.023101 * RH)
           - 4.686035;

  // Correction using vapor pressure difference
  const Tw_corrected = Tw - (e_s - e_a) / (gamma * 10);
  return Tw_corrected;
}

function computeWetBulbDepression() {
  const dryBulb = Number(document.querySelector('input[name="dry_bulb"]').value);
  const wetBulb = Number(document.querySelector('input[name="wet_bulb"]').value);

  return dryBulb - wetBulb;
}

document.querySelector('input[name ="wb_dep"]').value = computeWetBulbDepression();
