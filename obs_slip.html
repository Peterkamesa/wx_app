<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observation Slip - KMD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-4">
        <h2 class="text-center text-primary mb-4">KENYA METEOROLOGICAL DEPARTMENT</h2>
        <h4 class="text-center mb-3">Observation Slip (Form 393 Rev. 9/2011)</h4>
        
        <form id="obsForm" method="POST" action="/save-observation">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Time (GMT)</label>
                    <input type="time" name="time" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>
            </div>

            <h5 class="mt-4">a) CLOUDS</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-sm">
                    <thead>
                        <tr>
                            <th>Level</th><th>Type</th><th>Oktas</th><th>Height</th><th>CL Code</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>Low1</td><td><input name="low_type1" class="form-control"></td><td><input name="low_oktas1" class="form-control"></td><td><input name="low_height1" class="form-control"></td><td><input name="low_cl1" class="form-control"></td></tr>
                        <tr><td>Low2</td><td><input name="low_type2" class="form-control"></td><td><input name="low_oktas2" class="form-control"></td><td><input name="low_height2" class="form-control"></td><td><input name="low_cl2" class="form-control"></td></tr>
                        <tr><td>Low3</td><td><input name="low_type3" class="form-control"></td><td><input name="low_oktas3" class="form-control"></td><td><input name="low_height3" class="form-control"></td><td><input name="low_cl3" class="form-control"></td></tr>
                        <tr><td>Medium1</td><td><input name="med_type1" class="form-control"></td><td><input name="med_oktas1" class="form-control"></td><td><input name="med_height1" class="form-control"></td><td><input name="med_cl1" class="form-control"></td></tr>
                        <tr><td>Medium2</td><td><input name="med_type2" class="form-control"></td><td><input name="med_oktas2" class="form-control"></td><td><input name="med_height2" class="form-control"></td><td><input name="med_cl2" class="form-control"></td></tr>
                        <tr><td>Medium3</td><td><input name="med_type3" class="form-control"></td><td><input name="med_oktas3" class="form-control"></td><td><input name="med_height3" class="form-control"></td><td><input name="med_cl3" class="form-control"></td></tr>
                        <tr><td>High1</td><td><input name="high_type1" class="form-control"></td><td><input name="high_oktas1" class="form-control"></td><td><input name="high_height1" class="form-control"></td><td><input name="high_cl1" class="form-control"></td></tr>
                        <tr><td>High2</td><td><input name="high_type2" class="form-control"></td><td><input name="high_oktas2" class="form-control"></td><td><input name="high_height2" class="form-control"></td><td><input name="high_cl2" class="form-control"></td></tr>
                        <tr><td>High3</td><td><input name="high_type3" class="form-control"></td><td><input name="high_oktas3" class="form-control"></td><td><input name="high_height3" class="form-control"></td><td><input name="high_cl3" class="form-control"></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Cloud Searchlight Alidade Reading (°)</label>
                    <input name="alidade" class="form-control">
                </div>
                <div class="col-md-6">
                    <label>Rainfall (mm)</label>
                    <input name="rainfall" class="form-control">
                </div>
            </div>

            <h5>b) SCREEN</h5>
            <div class="row mb-3">
                <div class="col"><label>Dry Bulb</label><input name="dry_bulb" class="form-control"></div>
                <div class="col"><label>Wet Bulb</label><input name="wet_bulb" class="form-control"></div>
                <div class="col"><label>Max Temp</label><input name="max_temp" class="form-control"></div>
                <div class="col"><label>Min Temp</label><input name="min_temp" class="form-control"></div>
            </div>

            <h5>c) OUTDOOR</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Present Weather</label>
                    <input name="weather" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Visibility</label>
                    <input name="visibility" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Wind (kts)</label>
                    <input name="wind" class="form-control">
                </div>
            </div>

            <h5>d) OFFICE</h5>
            <div class="row mb-3">
                <div class="col-md-4"><label>Pr. As Read (mb)</label><input name="pr_read" class="form-control"></div>
                <div class="col-md-4"><label>Correction (mb)</label><input name="correction" class="form-control"></div>
                <div class="col-md-4"><label>M.S.L. Pr (mb)</label><input name="mslp" class="form-control"></div>
            </div>

            <h5>e) ENCLOSURE</h5>
            <div class="row mb-3">
                <div class="col-md-4"><label>Evaporation Pan (+/- Cups)</label><input name="evap_pan" class="form-control"></div>
                <div class="col-md-4"><label>Anemometer (Wind Run mi)</label><input name="wind_run" class="form-control"></div>
                <div class="col-md-4"><label>Gunn-Bellani (Reading)</label><input name="gunn_bellani" class="form-control"></div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary mt-3">Save Observation</button>
            </div>
        </form>
    </div>
</body>
</html>
