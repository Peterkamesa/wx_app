<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aviation Weather</title>
    <link rel="icon" type="image/x-icon" href="favicon2.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1b1b53;
            --secondary-color: #3a3a8f;
            --accent-color: #06f07b;
            --highlight-color: #ff4ed9;
        }
        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #f8f9fa;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.8rem 1rem;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-color);
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.5); }
        .btn-login {
            background: var(--accent-color);
            color: var(--primary-color);
            border: none;
            padding: 0.8rem;
            font-weight: 700;
            width: 100%;
            border-radius: 10px;
            margin-top: 1.5rem;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background: #05d06a;
            transform: translateY(-2px);
        }
        .logo-box {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-box img {
            height: 60px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="logo2.jpg" alt="Logo">
            <h2 class="mt-3">Aviation Weather</h2>
            <p class="text-white-50 small">Access Station or Pilot Dashboard</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="form-label small text-uppercase fw-bold text-white-50">Station / Username</label>
                <input type="text" id="loginStation" class="form-control" placeholder="Enter station name (e.g. JKIA, Admin)" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label small text-uppercase fw-bold text-white-50">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-login">SIGN IN</button>
        </form>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-white-50 text-decoration-none small"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
