<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Dashboard - Aviation Weather</title>
    <link rel="icon" type="image/x-icon" href="favicon2.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --vfr-color: #00d26a;
            --mvfr-color: #0085ff;
            --ifr-color: #f8312f;
            --lifr-color: #9c27b0;
            --dashboard-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }
        body {
            background-color: var(--dashboard-bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            height: 100%;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }
        .station-icao {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }
        .flight-category {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .cat-vfr { background: rgba(0, 210, 106, 0.2); color: var(--vfr-color); border: 1px solid var(--vfr-color); }
        .cat-ifr { background: rgba(248, 49, 47, 0.2); color: var(--ifr-color); border: 1px solid var(--ifr-color); }
        
        .metar-content {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            color: #94a3b8;
            margin-top: 1rem;
        }
        .timestamp {
            font-size: 0.8rem;
            color: #64748b;
        }
        .dashboard-header {
            padding: 2rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            background-color: var(--vfr-color);
            box-shadow: 0 0 10px var(--vfr-color);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(1); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.05);">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="logo2.jpg" alt="Logo" height="30"> Wx App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="dynamic-nav">
                    <!-- Populated dynamically by auth.js -->
                </ul>
            </div>
        </div>
    </nav>

    <div class="dashboard-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="mb-0">Pilot/ATC Dashboard</h1>
                    <p class="mb-0 text-muted small"><span class="status-dot"></span> Live Weather Stream</p>
                </div>
                <div>
                    <span id="user-display" class="me-3 small text-muted"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row g-4" id="weatherGrid">
            <!-- Loading skeleton -->
            <div class="col-md-6 col-lg-4">
                <div class="glass-card">
                    <div class="placeholder-glow">
                        <span class="placeholder col-6"></span>
                        <span class="placeholder col-12 mt-3"></span>
                        <span class="placeholder col-12 mt-2"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getUser();
            if (!user) {
                window.location.href = 'login.html'; // Use general login for now
                return;
            }
            document.getElementById('user-display').textContent = `Logged in as: ${user.name}`;
            
            await refreshData();
            setInterval(refreshData, 60000); // Auto refresh every minute
        });

        async function refreshData() {
            try {
                const res = await authenticatedFetch(`${API_BASE_URL}/dashboard/latest-reports`);
                const data = await res.json();
                
                const grid = document.getElementById('weatherGrid');
                if (data.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted">No reports available</div>';
                    return;
                }

                grid.innerHTML = data.map(item => {
                    const report = item.latestReport;
                    if (!report) return '';
                    
                    const category = determineCategory(report.content);
                    const timeAgo = getTimeAgo(report.createdAt);

                    return `
                        <div class="col-md-6 col-lg-4">
                            <div class="glass-card">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <div class="station-icao">${item.icaoCode}</div>
                                        <div class="text-muted small">${item.stationName}</div>
                                    </div>
                                    <span class="flight-category cat-${category.toLowerCase()}">${category}</span>
                                </div>
                                <div class="metar-content">${report.content}</div>
                                <div class="mt-3 d-flex justify-content-between align-items-center">
                                    <span class="timestamp"><i class="far fa-clock me-1"></i>${timeAgo}</span>
                                    <span class="badge ${report.type === 'SPECI' ? 'bg-danger' : 'bg-primary'} small">${report.type}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
            }
        }

        function determineCategory(metar) {
            // Simplified logic: Search for CAVOK or visual clues
            if (metar.includes('CAVOK')) return 'VFR';
            // In a real app, you'd parse visibility and ceiling here
            return 'VFR'; // Placeholder
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 60) return 'Just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            return `${hours}h ago`;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
