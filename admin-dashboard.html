<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Aviation Weather</title>
    <link rel="icon" type="image/x-icon" href="favicon2.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin-primary: #1a1c23;
            --admin-secondary: #24262d;
            --admin-accent: #7e3af2;
        }
        body {
            background-color: var(--admin-primary);
            color: #d5d6d7;
            font-family: 'Inter', sans-serif;
        }
        .sidebar {
            background-color: var(--admin-secondary);
            height: 100vh;
            position: fixed;
            width: 240px;
            padding-top: 2rem;
            border-right: 1px solid #3f4147;
        }
        .main-content {
            margin-left: 240px;
            padding: 2rem;
        }
        .card {
            background-color: var(--admin-secondary);
            border: 1px solid #3f4147;
            color: #d5d6d7;
        }
        .btn-admin {
            background-color: var(--admin-accent);
            color: white;
            border: none;
        }
        .btn-admin:hover {
            background-color: #6c2bd9;
            color: white;
        }
        .table {
            color: #d5d6d7;
        }
        .table thead th {
            border-bottom: 2px solid #3f4147;
            color: #9e9e9e;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .table td {
            border-bottom: 1px solid #3f4147;
            vertical-align: middle;
        }
        .modal-content {
            background-color: var(--admin-secondary);
            color: #d5d6d7;
        }
        .form-control {
            background-color: #24262d;
            border: 1px solid #3f4147;
            color: #d5d6d7;
        }
        .form-control:focus {
            background-color: #24262d;
            color: #d5d6d7;
            border-color: var(--admin-accent);
            box-shadow: 0 0 0 0.25rem rgba(126, 58, 242, 0.25);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="px-4 mb-5">
            <h4 class="text-white"><i class="fas fa-user-shield me-2"></i>Admin Panel</h4>
        </div>
        <nav class="nav flex-column px-3">
            <a class="nav-link text-white active mb-2" href="#"><i class="fas fa-broadcast-tower me-2"></i>Stations</a>
            <a class="nav-link text-white-50 mb-2" href="#" onclick="alert('Global Reports coming soon')"><i class="fas fa-file-alt me-2"></i>All Reports</a>
            <hr class="border-secondary">
            <a class="nav-link text-white-50" href="index.html"><i class="fas fa-home me-2"></i>Back to Site</a>
            <a class="nav-link text-danger mt-5" href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Station Management</h2>
            <button class="btn btn-admin" data-bs-toggle="modal" data-bs-target="#stationModal">
                <i class="fas fa-plus me-2"></i>Add New Station
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>ICAO Code</th>
                                <th>Station #</th>
                                <th>Elevation (m)</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="stationTableBody">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Station Modal -->
    <div class="modal fade" id="stationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="modalTitle">Add New Station</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-auto-close="true" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="stationForm">
                        <input type="hidden" id="stationId">
                        <div class="mb-3">
                            <label class="form-label">Station Name</label>
                            <input type="text" class="form-control" id="stName" required placeholder="e.g. JKIA">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ICAO Code</label>
                            <input type="text" class="form-control" id="stIcao" required placeholder="e.g. HKJK">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Station Number</label>
                            <input type="text" class="form-control" id="stNumber" required placeholder="e.g. 63740">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-control" id="stRole">
                                <option value="station">Weather Station</option>
                                <option value="pilot">Pilot/ATC</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Latitude</label>
                                <input type="number" step="any" class="form-control" id="stLat" placeholder="e.g. -1.3192">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Longitude</label>
                                <input type="number" step="any" class="form-control" id="stLng" placeholder="e.g. 36.9275">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Elevation (m)</label>
                                <input type="number" step="any" class="form-control" id="stElevation" placeholder="e.g. 1632">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="stPass" placeholder="Enter password (leave blank to keep existing if editing)">
                        </div>
                        <div class="modal-footer border-secondary px-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-admin">Save Station</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        const stationModal = new bootstrap.Modal(document.getElementById('stationModal'));
        
        document.addEventListener('DOMContentLoaded', () => {
            const user = getUser();
            if (!user || user.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            loadStations();
        });

        async function loadStations() {
            try {
                const res = await authenticatedFetch(`${API_BASE_URL}/admin/stations`);
                const stations = await res.json();
                
                const tbody = document.getElementById('stationTableBody');
                tbody.innerHTML = stations.map(s => `
                    <tr>
                        <td class="fw-bold text-white">${s.name}</td>
                        <td><span class="badge bg-secondary">${s.icaoCode}</span></td>
                        <td>${s.number}</td>
                        <td>${s.elevation || '—'}</td>
                        <td><span class="small text-uppercase">${s.role}</span></td>
                        <td><span class="badge bg-success">Active</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-info me-1" onclick="editStation('${s._id}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteStation('${s._id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function editStation(id) {
            try {
                const res = await authenticatedFetch(`${API_BASE_URL}/admin/stations`);
                const stations = await res.json();
                const s = stations.find(x => x._id === id);
                
                document.getElementById('stationId').value = s._id;
                document.getElementById('stName').value = s.name;
                document.getElementById('stIcao').value = s.icaoCode;
                document.getElementById('stNumber').value = s.number;
                document.getElementById('stLat').value = s.location?.lat || '';
                document.getElementById('stLng').value = s.location?.lng || '';
                document.getElementById('stElevation').value = s.elevation || '';
                document.getElementById('stRole').value = s.role;
                document.getElementById('stPass').value = '';
                
                document.getElementById('modalTitle').textContent = 'Edit Station';
                stationModal.show();
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('stationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('stationId').value;
            const data = {
                name: document.getElementById('stName').value,
                icaoCode: document.getElementById('stIcao').value,
                number: document.getElementById('stNumber').value,
                role: document.getElementById('stRole').value,
                location: {
                    lat: parseFloat(document.getElementById('stLat').value) || null,
                    lng: parseFloat(document.getElementById('stLng').value) || null
                },
                elevation: parseFloat(document.getElementById('stElevation').value) || null
            };
            
            const pass = document.getElementById('stPass').value;
            if (pass) data.password = pass;
            
            try {
                const url = id ? `${API_BASE_URL}/admin/stations/${id}` : `${API_BASE_URL}/admin/stations`;
                const method = id ? 'PUT' : 'POST';
                
                const res = await authenticatedFetch(url, {
                    method,
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    stationModal.hide();
                    loadStations();
                    e.target.reset();
                    document.getElementById('stationId').value = '';
                } else {
                    const err = await res.json();
                    alert(err.message || 'Error saving station');
                }
            } catch (err) {
                console.error(err);
            }
        });

        async function deleteStation(id) {
            if (!confirm('Delete this station? This cannot be undone.')) return;
            try {
                const res = await authenticatedFetch(`${API_BASE_URL}/admin/stations/${id}`, { method: 'DELETE' });
                if (res.ok) loadStations();
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
